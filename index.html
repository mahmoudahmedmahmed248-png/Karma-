<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0a08">
  <meta name="description" content="كارما العقارية - الثقة • التميز • الريادة">
  <title>كارما العقارية | روابطنا</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;700&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <style>
    /* ==========================================================
       ⚙️ إعدادات تقدر تعدلها بإيدك (غيّر الأرقام بس)
       ========================================================== */
    :root{

      /* ---- الخانات الزجاجية ---- */
      --glass:.00;          /* الشفافية: 0 = شفاف تماماً ... 0.3 = معتم أكتر */
      --blur:0px;           /* التغبيش: 0px = من غير تغبيش ... 20px = تغبيش قوي */
      --border:.5;          /* وضوح الحدود الذهبية: 0 = مفيش ... 1 = واضح جداً */
      --radius:20px;        /* استدارة الأطراف */
      --btn-height:84px;    /* ارتفاع الخانة */
      --btn-gap:16px;       /* المسافة بين الخانات */

      /* ---- اللوجو الخلفي ---- */
      --logo-opacity:.6;    /* وضوح اللوجو: 0 = مختفي ... 1 = واضح جداً */
      --logo-size:820px;    /* حجم اللوجو */
      --logo-pos:46%;       /* مكانه من فوق: 0% = فوق خالص ... 100% = تحت */

      /* ---- العنوان ---- */
      --title-size:68px;    /* حجم كلمة كارما العقارية */
      --title-space:34px;   /* المسافة فوق العنوان */

      /* ---- الألوان ---- */
      --gold:#d6b45e;
      --gold2:#f4d98b;
      --text:#f8efd6;
      --bg:#0b0a08;
    }

    /* ==========================================================
       باقي التصميم
       ========================================================== */
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0}
    body{min-height:100vh;color:var(--text);font-family:'Tajawal',Tahoma,Arial,sans-serif;
      background:radial-gradient(ellipse at 50% 0%,#4a3c1e 0%,#1d1910 32%,var(--bg) 72%);
      display:flex;justify-content:center;padding:28px 18px 40px;position:relative;overflow-x:hidden}

    /* اللوجو الخلفي */
    body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
      background:url("logo.png") center var(--logo-pos) / min(165vw,var(--logo-size)) auto no-repeat;
      opacity:var(--logo-opacity);mix-blend-mode:screen}
    body::after{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
      background:radial-gradient(ellipse at 50% 50%,transparent 55%,rgba(0,0,0,.35) 100%)}

    .wrap{position:relative;z-index:1;width:100%;max-width:460px;text-align:center}

    /* العنوان */
    h1{font-family:'Reem Kufi','Tajawal',serif;font-weight:700;font-size:var(--title-size);line-height:1.25;
      margin:var(--title-space) 0 6px;
      background:linear-gradient(180deg,#fff6cf 0%,#f4d98b 38%,#c9a24b 72%,#8f7231 100%);
      -webkit-background-clip:text;background-clip:text;color:transparent;
      filter:drop-shadow(0 3px 14px rgba(214,180,94,.4))}
    .tag{color:#e3d7b3;font-size:15px;margin:0 0 22px;letter-spacing:.5px;font-weight:500}
    .line{height:1px;width:72%;margin:0 auto 26px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}

    /* الخانات الزجاجية */
    .links{display:grid;gap:var(--btn-gap)}
    .link{display:flex;align-items:center;justify-content:center;gap:18px;min-height:var(--btn-height);
      padding:14px 20px;border-radius:var(--radius);text-decoration:none;color:var(--text);
      background:linear-gradient(135deg,rgba(255,255,255,calc(var(--glass) * 1.6)),rgba(255,255,255,var(--glass)));
      border:1px solid rgba(255,235,170,var(--border));
      backdrop-filter:blur(var(--blur)) saturate(150%);-webkit-backdrop-filter:blur(var(--blur)) saturate(150%);
      box-shadow:0 8px 26px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.25);
      transition:transform .2s,border-color .2s,background .2s}
    .link:hover,.link:active{transform:translateY(-2px);border-color:var(--gold2);
      background:linear-gradient(135deg,rgba(255,255,255,calc(var(--glass) * 2.4)),rgba(255,255,255,calc(var(--glass) * 1.4)))}

    /* الأيقونات */
    .ico{flex:0 0 38px;width:38px;height:38px;color:var(--gold)}
    .ico svg{width:100%;height:100%;display:block;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

    /* نص الخانات */
    .txt{display:flex;flex-direction:column;align-items:flex-start;gap:1px;min-width:150px}
    .txt b{font-size:19px;font-weight:700;line-height:1.5;text-shadow:0 1px 6px rgba(0,0,0,.6)}
    .phone{direction:ltr;unicode-bidi:embed;font-size:14px;color:#d9c58d;font-weight:400;letter-spacing:1px}

    footer{margin-top:28px;color:#9f967f;font-size:12px;line-height:1.8}
    @media(max-width:360px){h1{font-size:56px}.txt b{font-size:16px}}
  </style>
</head>
<body>
  <main class="wrap">

    <!-- ✏️ العنوان والشعار اللفظي -->
    <h1>كارما العقارية</h1>
    <p class="tag">الثقة • التميز • الريادة</p>
    <div class="line"></div>

    <nav class="links" aria-label="روابط كارما العقارية">

      <!-- ☎ اتصال: غيّر الرقم في href وفي السطر اللي تحته -->
      <a class="link" href="tel:01154063000">
        <span class="ico"><svg viewBox="0 0 24 24"><path d="M5 4h3.2l1.6 4.2-2 1.4a11.5 11.5 0 0 0 5.600 5.600l1.400-2 4.200 1.600V19a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/></svg></span>
        <span class="txt"><b>اتصل بنا</b><span class="phone">01154063000</span></span>
      </a>

      <!-- ✆ واتساب: الرقم في الرابط لازم يبدأ بـ 20 من غير صفر (مثال: 201277466360) -->
      <a class="link" href="https://wa.me/201277466360" target="_blank" rel="noopener">
        <span class="ico"><svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 0 0-7.800 13.500L3 21l4.600-1.200A9 9 0 1 0 12 3z"/><path d="M9.200 8.400c-.3 0-.5.100-.7.300-.6.700-.8 1.600-.4 2.700.9 2.200 2.700 4 4.900 4.900 1.100.4 2 .2 2.700-.4.300-.3.300-.8 0-1.100l-1.100-1.100c-.3-.3-.7-.3-1.100-.1l-.6.400c-.2.100-.4.100-.5 0a5.700 5.700 0 0 1-2.400-2.400c-.1-.2-.1-.4 0-.5l.4-.6c.2-.4.200-.8-.1-1.100L9.800 8.600c-.1-.1-.4-.2-.6-.2z"/></svg></span>
        <span class="txt"><b>تواصل معنا عبر واتساب</b><span class="phone">01277466360</span></span>
      </a>

      <!-- f فيسبوك: غيّر الرابط في href -->
      <a class="link" href="https://www.facebook.com/share/1EzhEYyR5z/" target="_blank" rel="noopener">
        <span class="ico"><svg viewBox="0 0 24 24"><path d="M14 8h2.500V4.500H14A4.500 4.500 0 0 0 9.500 9v2H7v3.500h2.500V21H13v-6.500h2.500L16 11h-3V9.500c0-.8.400-1.500 1-1.500z"/></svg></span>
        <span class="txt"><b>تابعنا على فيسبوك</b></span>
      </a>

      <!-- 📍 الموقع: غيّر رابط الخريطة في href -->
      <a class="link" href="https://maps.app.goo.gl/SqRrF9THcA92zGDZ7" target="_blank" rel="noopener">
        <span class="ico"><svg viewBox="0 0 24 24"><path d="M12 21s-7-6.200-7-11.500a7 7 0 0 1 14 0C19 14.800 12 21 12 21z"/><circle cx="12" cy="9.500" r="2.600"/></svg></span>
        <span class="txt"><b>موقع المكتب على الخريطة</b></span>
      </a>

    </nav>

    <footer>كارما العقارية<br>نساعدك تختار صح</footer>
  </main>
</body>
</html>
